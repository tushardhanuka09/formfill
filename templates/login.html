{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
        <h2 class="text-xl font-bold text-center text-slate-900 mb-1">Survey Admin Portal</h2>
        <p class="text-xs text-center text-slate-500 mb-6">Enter PIN to access survey responses & PDF downloads</p>

        {% if error %}
        <div class="bg-red-50 text-red-700 text-xs p-3 rounded-lg mb-4 border border-red-200">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Admin PIN / Password</label>
                <input type="password" name="password" required autofocus placeholder="Default: admin123" 
                       class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition text-sm">
                Unlock Dashboard
            </button>
        </form>
    </div>
</div>
{% endblock %}
